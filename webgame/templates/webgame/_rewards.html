<div class="reward-list">{% for row in rows %}<div class="reward-row"><strong>{{ row.name }}</strong><span class="reward-value">{{ row.display_xp }} XP</span><small>{% if row.correction %}Корректировка · {% else %}Рассчитано {{ row.calculated_xp }} · в долг {{ row.rust_paid }} · {% endif %}уровень {{ row.level_before }} → {{ row.level_after }} · остаток {{ row.xp_after }} XP</small></div>{% endfor %}</div>
